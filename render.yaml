services:
  - type: web
    name: boater-poll
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: POLL_ADMIN_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
