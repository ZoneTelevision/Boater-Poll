<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Crusader vs MerCruiser — Boater Poll{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14202b;--muted:#5b6b78;--line:#d9e1e7;--bg:#f4f1ea;--card:#fff;
--cru:#1f5fbf;--mer:#1b1b1b;--accent:#c8102e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 20px}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font:700 26px/1.1 Oswald,sans-serif;letter-spacing:.5px;margin:0;text-transform:uppercase}
header nav a{color:#fff;opacity:.85;margin-left:16px;text-decoration:none;font-weight:600}
header nav a:hover{opacity:1;text-decoration:underline}
.wrap{max-width:960px;margin:0 auto}
main{padding:28px 20px 60px}
h2{font:700 22px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.4px;margin:32px 0 10px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:8px;
padding:14px 26px;font:600 18px "Source Sans 3",sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.notice{background:#fff7d6;border:1px solid #ecd77a;border-radius:8px;padding:10px 14px;margin-bottom:18px}
.error{background:#fde7ea;border-color:#f1a1ad}
footer{color:var(--muted);font-size:14px;text-align:center;padding:20px}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header><div class="wrap">
  <h1>Crusader vs MerCruiser</h1>
  <nav><a href="{{ url_for('poll') }}">Vote</a><a href="{{ url_for('results') }}">Results</a></nav>
</div></header>
<main class="wrap">{% block body %}{% endblock %}</main>
<footer>One vote per person. You can come back and change your vote anytime.</footer>
</body>
</html>
